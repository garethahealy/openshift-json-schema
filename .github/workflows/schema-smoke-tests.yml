name: Schema smoke tests

on: [ push, pull_request ]

permissions: read-all

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=yannh/kubeconform
      KUBECONFORM_VERSION: v0.7.0
      OCP_SCHEMA_VERSION: "4.19.0"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate sample manifests via kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
        with:
          args: >-
            -summary
            -kubernetes-version ${{ env.OCP_SCHEMA_VERSION }}
            -schema-location "${{ github.workspace }}/{{ .NormalizedKubernetesVersion }}/schemas/{{ .ResourceKind }}{{ .KindSuffix }}.json"
            test/fixtures/route.yaml
            test/fixtures/securitycontextconstraints.yaml
            test/fixtures/deployment.yaml
